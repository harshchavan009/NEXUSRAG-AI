name: NexusRAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pip-audit
        run: |
          python -m pip_audit -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v --cov=backend/app

  frontend-test:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run ESLint AST Symbol & Undefined Scope Validation
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm run test -- --run

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build

  secret-scan:
    name: Secret Detection & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Scan working tree for secrets
        run: |
          detect-secrets scan --exclude-files '(\.git|\.pytest_cache|node_modules|dist|storage|\.system_generated|\.user_uploaded)'

      - name: Verify zero committed API keys in Git history
        run: |
          if git log -p | grep -E "(AIza[0-9A-Za-z\-_]{35}|sk-[a-zA-Z0-9]{48}|ghp_[a-zA-Z0-9]{36})"; then
            echo "Security Alert: Potential secret found in git history!"
            exit 1
          else
            echo "Git history secret scan clean: 0 exposed keys."
          fi

  route-smoke-test:
    name: Playwright Route Smoke Test (Zero Console Errors)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt playwright
          playwright install chromium --with-deps
          cd frontend && npm ci && npm run build
      - name: Start servers and Run Smoke Tests
        run: |
          uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 &
          npm --prefix frontend run preview -- --port 5173 &
          sleep 5
          python scripts/test_route_smoke.py

