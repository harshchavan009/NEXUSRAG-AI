services:
  - type: web
    name: nexusrag
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    disk:
      name: nexusrag-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: NexusRAG
      - key: APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexusrag-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_QUERIES_PER_DAY
        value: "200"
      - key: RATE_LIMIT_UPLOADS_PER_DAY
        value: "50"
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: nexusrag-postgres
    plan: starter
    region: oregon
    databaseName: nexusrag
    user: nexusrag_user

