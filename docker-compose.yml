version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusrag_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusrag
      POSTGRES_USER: nexusrag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusrag_secret}
    volumes:
      - nexusrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusrag_user -d nexusrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  nexusrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusrag_assistant
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - APP_NAME=NexusRAG
      - APP_VERSION=1.3.0
      - DATABASE_URL=postgresql://nexusrag_user:${POSTGRES_PASSWORD:-nexusrag_secret}@postgres:5432/nexusrag
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_QUERIES_PER_DAY=200
      - RATE_LIMIT_UPLOADS_PER_DAY=50
      - SESSION_COOKIE_SECURE=false
    volumes:
      - nexus_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexusrag_pgdata:
    driver: local
  nexus_storage:
    driver: local
