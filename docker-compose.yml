version: '3.8'

services:
  nexusrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusrag_assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - APP_NAME=NexusRAG
      - APP_VERSION=1.0.0
      - DATABASE_URL=sqlite:///./storage/nexus.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=60
      - RATE_LIMIT_QUERIES_PER_DAY=200
      - RATE_LIMIT_UPLOADS_PER_DAY=50
      - SESSION_COOKIE_SECURE=false
    volumes:
      - nexus_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nexus_storage:
    driver: local
